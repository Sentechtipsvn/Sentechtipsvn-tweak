name: Build IPARanger VN rootless (test)
on:
  push:
    branches:
      - dev/iparanger-v031-language-unicorn-20261118
    paths:
      - "build/iparanger/**"
      - ".github/workflows/build-iparanger-vn.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ipatool:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download official ipatool 2.8.1 and 2.8.0 source
        run: |
          git clone --depth 1 --branch v2.8.1 https://github.com/majd/ipatool.git backend-src
          git clone --depth 1 --branch v2.8.0 https://github.com/majd/ipatool.git backend-legacy
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-src/go.mod
          cache: false
      - name: Apply account-bound storefront fallback
        run: |
          python3 build/iparanger/patch_ipatool.py backend-src backend-legacy
          cd backend-src
          gofmt -w pkg/appstore/storefront.go pkg/appstore/storefront_fallback_vn.go cmd/auth.go
          go test ./pkg/appstore -run 'TestCountryCode' -count=1 || echo "Noncritical test filter mismatch"
      - name: Fix Unicorn ARM64 emulator support in official iOS build script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path("backend-src/tools/build-ios.sh")
          data=file.read_text()
          old="-DUNICORN_ARCH=x86 "
          assert data.count(old)==1, "Unicorn build configuration changed upstream"
          data=data.replace(old, "-DUNICORN_ARCH=aarch64 ")
          file.write_text(data)
          print("Enabled aarch64 emulator; avoids duplicate C symbols from linking both emulators")
          PY
      - name: Compile patched iOS ARM64 binary
        run: |
          brew install ldid cmake
          cd backend-src
          VERSION=2.8.1-vn0.3 ./tools/build-ios.sh ipatool-ios-arm64
          file ipatool-ios-arm64
          test -s ipatool-ios-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-ios-arm64-patched
          path: backend-src/ipatool-ios-arm64
          if-no-files-found: error
  build-rootless:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    needs: build-ipatool
    steps:
      - uses: actions/checkout@v4
      - name: Download patched ipatool backend
        uses: actions/download-artifact@v4
        with:
          name: ipatool-ios-arm64-patched
          path: backend
      - name: Install Theos and iOS toolchain
        env:
          CI: "true"
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Compile patched rootless application package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash build/iparanger/build.sh
      - name: Upload test DEB
        uses: actions/upload-artifact@v4
        with:
          name: IPARanger-VN-v0.3.1-Language-Unicorn-Rootless
          path: upstream/packages/*iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish prerelease DEB for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iparanger-vn-2.8.2-vn0.3.1-test"
          DEB="upstream/packages/com.0xkuj.iparanger_2.8.2+vn0.3.1_iphoneos-arm64.deb"
          test -s "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.0xkuj.iparanger"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$DEB" Version)" = "2.8.2+vn0.3.1"
          sha256sum "$DEB"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --target "$GITHUB_SHA" --prerelease --title "IPARanger VN v0.3.1 — Unicorn ARM64 + Language" --notes "Experimental v0.3.1 for iPhone 7 Plus iOS 15.8.8 / Dopamine rootless. Fixes prior ipatool Unicorn UC_ERR_ARCH by enabling aarch64 emulator backend. Adds Account > Language (Tiếng Việt / English), persistent language preference and extensible .lproj translation files. Adjusts download icon padding, shows per-version minimum iOS when supplied. Preserves Apple ID storefront behavior, search and existing IPA storage. Still requires real device testing before stable Sileo release. MIT attribution: 0xkuj/IPARanger and majd/ipatool."
          fi

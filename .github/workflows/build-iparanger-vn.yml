name: Build IPARanger VN rootless (test)
on:
  push:
    branches:
      - dev/iparanger-vn-vi-20261117
    paths:
      - "build/iparanger/**"
      - ".github/workflows/build-iparanger-vn.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-rootless:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and iOS toolchain
        env:
          CI: "true"
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Compile patched rootless application package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash build/iparanger/build.sh
      - name: Upload test DEB
        uses: actions/upload-artifact@v4
        with:
          name: IPARanger-VN-v0.2-Tieng-Viet-rootless
          path: upstream/packages/*iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish prerelease DEB for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iparanger-vn-2.8.2-vn0.2-test"
          DEB="upstream/packages/com.0xkuj.iparanger_2.8.2+vn0.2_iphoneos-arm64.deb"
          test -s "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.0xkuj.iparanger"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$DEB" Version)" = "2.8.2+vn0.2"
          sha256sum "$DEB"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --target "$GITHUB_SHA" --prerelease --title "IPARanger VN 2.8.2+vn0.2 — Search Fix (rootless test)" --notes "IPA Ranger VN v0.2, rootless ARM64 iOS 14+. Builds on the user-tested v0.1 search crash fix. Translates main navigation, search, IPA management, version picker, account, login and alerts to Vietnamese. No changes to ipatool commands, bundle identifier, stored account data or installed IPA files. Original copyright 0xkuj, MIT. TEST BUILD, requires verification on the target iPhone 7 Plus."
          fi
